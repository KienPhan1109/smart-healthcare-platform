<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title>Điều phối - Tổng quan</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="welcome-section">
            <h2 class="welcome-title">Trung tâm Điều phối</h2>
            <p class="welcome-subtitle">Tiếp nhận, duyệt lịch và điều phối hàng đợi bệnh nhân.</p>
        </div>

        <div class="row g-3">
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="stat-card-header">
                        <div>
                            <div class="stat-card-value">0</div>
                            <div class="stat-card-label">Chờ duyệt</div>
                        </div>
                        <div class="stat-card-icon warning">
                            <i class="bi bi-hourglass-split"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="stat-card-header">
                        <div>
                            <div class="stat-card-value">0</div>
                            <div class="stat-card-label">Đã duyệt hôm nay</div>
                        </div>
                        <div class="stat-card-icon success">
                            <i class="bi bi-check2-all"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="stat-card-header">
                        <div>
                            <div class="stat-card-value">0</div>
                            <div class="stat-card-label">Tổng lịch hôm nay</div>
                        </div>
                        <div class="stat-card-icon primary">
                            <i class="bi bi-calendar-week"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
