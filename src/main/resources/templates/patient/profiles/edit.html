<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title>Cập Nhật Hồ Sơ Bệnh Nhân</title>
</head>
<body>
    <div layout:fragment="content">
        <link rel="stylesheet" th:href="@{/css/patient.css}">
        <div class="container py-4">
            <div class="row justify-content-center">
                <div class="col-md-10">
                    <div class="patient-card">
                        <div class="patient-card-header">
                            Cập Nhật Hồ Sơ Bệnh Nhân Chi Tiết
                        </div>
                        <div class="patient-card-body">
                            <form th:action="@{/patient/profiles/edit/{id}(id=${patient.id})}" th:object="${dto}" method="post">
                                
                                <div th:if="${#fields.hasErrors('global')}" class="alert-message alert-danger mb-4">
                                    <span th:errors="*{global}">Lỗi hệ thống</span>
                                </div>

                                <h5 class="fw-bold mb-3" style="color: var(--primary-blue)">1. Thông tin hành chính</h5>
                                
                                <div class="premium-form-group">
                                    <label class="premium-label">Họ và tên *</label>
                                    <input type="text" class="premium-input" th:field="*{fullName}" placeholder="Nhập đầy đủ họ và tên">
                                    <div class="error-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">Lỗi họ tên</div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="premium-form-group">
                                            <label class="premium-label">Ngày sinh *</label>
                                            <input type="date" class="premium-input" th:field="*{dateOfBirth}">
                                            <div class="error-feedback" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}">Lỗi ngày sinh</div>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="premium-form-group">
                                            <label class="premium-label">Giới tính *</label>
                                            <select class="premium-select" th:field="*{gender}">
                                                <option value="">-- Chọn giới tính --</option>
                                                <option value="MALE">Nam</option>
                                                <option value="FEMALE">Nữ</option>
                                                <option value="OTHER">Khác</option>
                                            </select>
                                            <div class="error-feedback" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}">Lỗi giới tính</div>
                                        </div>
                                    </div>
                                </div>

                                <div class="premium-form-group">
                                    <label class="premium-label">CCCD / CMND</label>
                                    <input type="text" class="premium-input" th:field="*{identityCard}" placeholder="Số CCCD gồm 12 chữ số">
                                    <div class="error-feedback" th:if="${#fields.hasErrors('identityCard')}" th:errors="*{identityCard}">Lỗi CCCD</div>
                                </div>

                                <h5 class="fw-bold mb-3 mt-4" style="color: var(--primary-blue)">2. Chỉ số sinh tồn cơ bản</h5>
                                <div class="row">
                                    <div class="col-md-4">
                                        <div class="premium-form-group">
                                            <label class="premium-label">Chiều cao (cm)</label>
                                            <input type="number" step="0.1" class="premium-input" th:field="*{height}" placeholder="VD: 170.5">
                                            <div class="error-feedback" th:if="${#fields.hasErrors('height')}" th:errors="*{height}">Lỗi chiều cao</div>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="premium-form-group">
                                            <label class="premium-label">Cân nặng (kg)</label>
                                            <input type="number" step="0.1" class="premium-input" th:field="*{weight}" placeholder="VD: 65.0">
                                            <div class="error-feedback" th:if="${#fields.hasErrors('weight')}" th:errors="*{weight}">Lỗi cân nặng</div>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="premium-form-group">
                                            <label class="premium-label">Nhóm máu</label>
                                            <select class="premium-select" th:field="*{bloodType}">
                                                <option value="">-- Chọn nhóm máu --</option>
                                                <option value="A_POSITIVE">A+</option>
                                                <option value="A_NEGATIVE">A-</option>
                                                <option value="B_POSITIVE">B+</option>
                                                <option value="B_NEGATIVE">B-</option>
                                                <option value="AB_POSITIVE">AB+</option>
                                                <option value="AB_NEGATIVE">AB-</option>
                                                <option value="O_POSITIVE">O+</option>
                                                <option value="O_NEGATIVE">O-</option>
                                                <option value="UNKNOWN">Chưa rõ</option>
                                            </select>
                                            <div class="error-feedback" th:if="${#fields.hasErrors('bloodType')}" th:errors="*{bloodType}">Lỗi nhóm máu</div>
                                        </div>
                                    </div>
                                </div>

                                <h5 class="fw-bold mb-3 mt-4" style="color: var(--primary-blue)">3. Tiền sử Y khoa</h5>
                                <div class="premium-form-group">
                                    <label class="premium-label">Tiền sử bệnh lý</label>
                                    <textarea class="premium-textarea" th:field="*{medicalHistory}" placeholder="Ghi chú về các bệnh lý đã hoặc đang mắc phải (nếu có)..."></textarea>
                                </div>
                                
                                <div class="premium-form-group">
                                    <label class="premium-label">Thông tin dị ứng</label>
                                    <textarea class="premium-textarea" th:field="*{allergies}" placeholder="Ghi chú các loại thuốc, thức ăn hoặc tác nhân gây dị ứng (nếu có)..."></textarea>
                                </div>

                                <h5 class="fw-bold mb-3 mt-4" style="color: var(--primary-blue)">4. Bảo hiểm Y tế</h5>
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="premium-form-group">
                                            <label class="premium-label">Mã thẻ BHYT</label>
                                            <input type="text" class="premium-input" th:field="*{insuranceNumber}" placeholder="VD: GD4797918800001">
                                            <div class="error-feedback" th:if="${#fields.hasErrors('insuranceNumber')}" th:errors="*{insuranceNumber}">Lỗi BHYT</div>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="premium-form-group">
                                            <label class="premium-label">Ngày hết hạn BHYT</label>
                                            <input type="date" class="premium-input" th:field="*{insuranceExpiryDate}">
                                        </div>
                                    </div>
                                </div>

                                 <div class="d-flex justify-content-between mt-5 align-items-center">
                                     <div th:if="${patient.relation != null and patient.relation.name() != 'SELF'}">
                                         <a th:href="@{/patient/profiles/delete/{id}(id=${patient.id})}" class="btn-danger-premium" style="text-decoration: none; display: inline-block; padding: 10px 20px;">
                                             <i class="bi bi-trash3 me-1"></i> Xóa hồ sơ
                                         </a>
                                     </div>
                                     <div class="d-flex gap-3">
                                         <a th:href="@{/patient/profiles}" class="btn-premium-outline">Quay lại</a>
                                         <button type="submit" class="btn-premium">Lưu Cập Nhật</button>
                                     </div>
                                 </div>
                             </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
