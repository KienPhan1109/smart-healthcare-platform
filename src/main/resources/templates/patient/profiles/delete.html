<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title>Xác Nhận Xóa Hồ Sơ</title>
</head>
<body>
    <div layout:fragment="content">
        <link rel="stylesheet" th:href="@{/css/patient.css}">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="patient-card">
                        <div class="patient-card-header patient-card-header-danger">
                            <i class="bi bi-trash3-fill me-2"></i> Xác Nhận Xóa Hồ Sơ
                        </div>
                        <div class="patient-card-body">
                            
                            <div th:if="${deleteError}" class="alert-message alert-danger mb-4">
                                <i class="bi bi-exclamation-octagon-fill me-2"></i> <span th:text="${deleteError}">Lỗi</span>
                            </div>

                            <p class="mb-4 text-center">Bạn đang yêu cầu xóa hồ sơ bệnh nhân dưới đây khỏi hệ thống.</p>
                            
                            <div class="p-4 bg-light rounded-4 mb-4">
                                <div class="row mb-2">
                                    <div class="col-5 text-muted">Họ và tên:</div>
                                    <div class="col-7 fw-bold" th:text="${patient.fullName}">Nguyễn Văn A</div>
                                </div>
                                <div class="row mb-2">
                                    <div class="col-5 text-muted">Quan hệ:</div>
                                    <div class="col-7 fw-bold text-primary" th:text="${patient.relation != null ? (patient.relation.name() == 'SELF' ? 'Bản thân' : (patient.relation.name() == 'CHILD' ? 'Con cái' : (patient.relation.name() == 'PARENT' ? 'Cha mẹ' : (patient.relation.name() == 'SPOUSE' ? 'Vợ chồng' : 'Khác')))) : 'Chưa rõ'}">Bản thân</div>
                                </div>
                                <div class="row mb-2">
                                    <div class="col-5 text-muted">Ngày sinh:</div>
                                    <div class="col-7 fw-bold" th:text="${patient.dateOfBirth != null ? #temporals.format(patient.dateOfBirth, 'dd/MM/yyyy') : 'Chưa cập nhật'}">01/01/1990</div>
                                </div>
                                <div class="row">
                                    <div class="col-5 text-muted">Giới tính:</div>
                                    <div class="col-7 fw-bold" th:text="${patient.gender != null ? (patient.gender.name() == 'MALE' ? 'Nam' : (patient.gender.name() == 'FEMALE' ? 'Nữ' : 'Khác')) : 'Chưa cập nhật'}">Nam</div>
                                </div>
                            </div>

                            <form th:if="${deleteError == null}" th:action="@{/patient/profiles/delete/{id}(id=${patient.id})}" method="post">
                                <div class="alert alert-warning small border-0" style="background-color: #fff3cd; color: #856404;">
                                    <i class="bi bi-info-circle-fill me-1"></i> Lưu ý: Hành động này sẽ làm ẩn hồ sơ và các thông tin y tế liên quan khỏi danh sách hiển thị của bạn.
                                </div>

                                <div class="d-flex gap-3 mt-4">
                                    <a th:href="@{/patient/profiles/edit/{id}(id=${patient.id})}" class="btn-premium-outline flex-grow-1 text-center py-2">
                                        Quay lại
                                    </a>
                                    <button type="submit" class="btn btn-danger fw-bold flex-grow-1 py-2" style="border-radius: 12px; font-size: 1rem;">
                                        <i class="bi bi-trash me-1"></i> Xác Nhận Xóa
                                    </button>
                                </div>
                            </form>

                            <div th:if="${deleteError != null}" class="d-flex gap-3 mt-4">
                                <a th:href="@{/patient/profiles/edit/{id}(id=${patient.id})}" class="btn-premium w-100 text-center py-2">
                                    <i class="bi bi-arrow-left me-1"></i> Quay lại hồ sơ
                                </a>
                            </div>
                            
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
