<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Smart Healthcare Platform - Nen tang Y te So Toan dien">
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">Smart Healthcare Platform</title>

    <!-- Fix favicon.ico error -->
    <link rel="icon" href="data:,">

    <!-- Bootstrap CSS --><link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/index.css}">
</head>
<body>
    <div class="app-wrapper">
        <!-- Sidebar -->
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <!-- Main Content Area -->
        <div class="app-main">
            <!-- Header -->
            <div th:replace="~{fragments/header :: header}"></div>

            <!-- Page Content (from child templates) -->
            <div class="app-content" layout:fragment="content">
            </div>

            <!-- Footer -->
            <div th:replace="~{fragments/footer :: footer}"></div>
        </div>
    </div>

    <script th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
    <script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
    <script layout:fragment="scripts"></script>
</body>
</html>
