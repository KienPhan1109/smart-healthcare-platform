<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <nav th:fragment="sidebar" class="sidebar">
        <!-- Brand -->
        <div class="sidebar-brand">
            <div class="sidebar-brand-icon">
                <i class="bi bi-hospital"></i>
            </div>
            <span class="sidebar-brand-text">SHP Medical</span>
        </div>

        <!-- Navigation -->
        <ul class="sidebar-nav">
            <!-- PATIENT Menu -->
            <li sec:authorize="hasAuthority('ROLE_PATIENT')">
                <div class="sidebar-section-title">Bệnh nhân</div>
            </li>
            <li class="sidebar-nav-item" sec:authorize="hasAuthority('ROLE_PATIENT')">
                <a th:href="@{/patient/dashboard}" class="sidebar-nav-link">
                    <span class="sidebar-nav-icon"><i class="bi bi-grid-1x2"></i></span>
                    Tổng quan
                </a>
            </li>
            <li class="sidebar-nav-item" sec:authorize="hasAuthority('ROLE_PATIENT')">
                <a th:href="@{/patient/profiles}" class="sidebar-nav-link">
                    <span class="sidebar-nav-icon"><i class="bi bi-people"></i></span>
                    Quản lý hồ sơ
                </a>
            </li>
            <li class="sidebar-nav-item" sec:authorize="hasAuthority('ROLE_PATIENT')">
                <a th:href="@{/patient/appointments/book}" class="sidebar-nav-link">
                    <span class="sidebar-nav-icon"><i class="bi bi-calendar-plus"></i></span>
                    Đặt lịch khám
                </a>
            </li>
            <li class="sidebar-nav-item" sec:authorize="hasAuthority('ROLE_PATIENT')">
                <a th:href="@{/patient/appointments/history}" class="sidebar-nav-link">
                    <span class="sidebar-nav-icon"><i class="bi bi-clock-history"></i></span>
                    Lịch sử khám bệnh
                </a>
            </li>

            <!-- DOCTOR Menu -->
            <li sec:authorize="hasAuthority('ROLE_DOCTOR')">
                <div class="sidebar-section-title">Bác sĩ</div>
            </li>
            <li class="sidebar-nav-item" sec:authorize="hasAuthority('ROLE_DOCTOR')">
                <a th:href="@{/doctor/dashboard}" class="sidebar-nav-link">
                    <span class="sidebar-nav-icon"><i class="bi bi-grid-1x2"></i></span>
                    Tổng quan
                </a>
            </li>



            <!-- ADMIN Menu -->
            <li sec:authorize="hasAuthority('ROLE_ADMIN')">
                <div class="sidebar-section-title">Quản trị</div>
            </li>
            <li class="sidebar-nav-item" sec:authorize="hasAuthority('ROLE_ADMIN')">
                <a th:href="@{/admin/dashboard}" class="sidebar-nav-link">
                    <span class="sidebar-nav-icon"><i class="bi bi-grid-1x2"></i></span>
                    Tổng quan
                </a>
            </li>
        </ul>

        <!-- User Footer -->
        <div class="sidebar-footer">
            <div class="sidebar-user">
                <div class="sidebar-user-avatar" id="sidebarAvatar">
                    U
                </div>
                <div class="sidebar-user-info">
                    <div class="sidebar-user-name" id="sidebarUserName" sec:authentication="name">Username</div>
                    <div class="sidebar-user-role">
                        <span sec:authorize="hasAuthority('ROLE_PATIENT')">Bệnh nhân</span>
                        <span sec:authorize="hasAuthority('ROLE_DOCTOR')">Bác sĩ</span>
                        <span sec:authorize="hasAuthority('ROLE_ADMIN')">Quản trị viên</span>
                    </div>
                </div>
                <!-- Đăng xuất được chuyển xuống dưới cùng của Sidebar -->
                <form th:action="@{/logout}" method="post" style="margin: 0; margin-left: auto;">
                    <button type="submit" class="btn-logout-sidebar" title="Đăng xuất">
                        <i class="bi bi-box-arrow-right"></i>
                    </button>
                </form>
            </div>
        </div>

        <!-- JS: Active Link & Avatar Initial (Đưa VÀO TRONG nav th:fragment để tránh bị Thymeleaf strip) -->
        <script th:inline="none">
            document.addEventListener('DOMContentLoaded', function () {
                // === 1. Tự động highlight sidebar link đang active ===
                var currentPath = window.location.pathname;
                var links = document.querySelectorAll('.sidebar-nav-link');
                var bestMatch = null;
                var bestLen = 0;

                links.forEach(function (link) {
                    var href = link.getAttribute('href');
                    if (href && (currentPath === href || currentPath.startsWith(href + '/')) && href.length > bestLen) {
                        bestMatch = link;
                        bestLen = href.length;
                    }
                });

                if (bestMatch) {
                    bestMatch.classList.add('active');
                }

                // === 2. Gán ký tự đầu tên vào avatar ===
                var nameEl = document.getElementById('sidebarUserName');
                var avatarEl = document.getElementById('sidebarAvatar');
                if (nameEl && avatarEl) {
                    var name = nameEl.textContent.trim();
                    if (name.length > 0) {
                        avatarEl.textContent = name.charAt(0).toUpperCase();
                    }
                }

                // === 3. Gán avatar cho header (nếu có) ===
                var headerAvatarEl = document.getElementById('headerAvatar');
                var headerNameEl = document.getElementById('headerUserName');
                if (headerAvatarEl && headerNameEl) {
                    var hName = headerNameEl.textContent.trim();
                    if (hName.length > 0) {
                        headerAvatarEl.textContent = hName.charAt(0).toUpperCase();
                    }
                }
            });
        </script>
    </nav>
</body>
</html>
