<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <header th:fragment="header" class="app-header">
        <!-- Phần trái: Lời chào -->
        <div class="header-greeting">
            <div class="header-greeting-title" id="headerGreeting">Xin chào</div>
            <div class="header-greeting-subtitle" id="headerDate"></div>
        </div>

        <!-- Phần phải: User info + Cài đặt tài khoản (đưa từ dưới navbar lên) -->
        <div class="header-actions">
            <div class="header-user-group">
                <div class="header-user-avatar" id="headerAvatar">U</div>
                <div class="header-user-info">
                    <div class="header-user-name" id="headerUserName" sec:authentication="name">Username</div>
                    <div class="header-user-role">
                        <span sec:authorize="hasAuthority('ROLE_PATIENT')">Bệnh nhân</span>
                        <span sec:authorize="hasAuthority('ROLE_DOCTOR')">Bác sĩ</span>
                        <span sec:authorize="hasAuthority('ROLE_ADMIN')">Quản trị viên</span>
                        <span sec:authorize="hasAuthority('ROLE_TECHNICIAN')">Kỹ thuật viên</span>
                    </div>
                </div>
            </div>
            
            <div class="header-divider"></div>
            
            <!-- Chỉnh sửa thông tin tài khoản đưa lên Header -->
            <a th:href="@{/profile}" class="btn-header-profile" title="Thiết lập tài khoản">
                <i class="bi bi-gear-fill"></i> Thiết lập
            </a>
        </div>

        <!-- JS: Lời chào động + Ngày tháng (Đưa VÀO TRONG header th:fragment để tránh bị Thymeleaf strip) -->
        <script th:inline="none">
            document.addEventListener('DOMContentLoaded', function () {
                var hour = new Date().getHours();
                var greeting = 'Xin chào';
                if (hour >= 5 && hour < 12) greeting = 'Chào buổi sáng';
                else if (hour >= 12 && hour < 18) greeting = 'Chào buổi chiều';
                else greeting = 'Chào buổi tối';

                var nameEl = document.getElementById('headerUserName');
                var name = nameEl ? nameEl.textContent.trim() : '';
                var greetEl = document.getElementById('headerGreeting');
                if (greetEl) {
                    greetEl.textContent = greeting + (name ? ', ' + name : '') + ' 👋';
                }

                // Ngày tháng
                var days = ['Chủ nhật', 'Thứ hai', 'Thứ ba', 'Thứ tư', 'Thứ năm', 'Thứ sáu', 'Thứ bảy'];
                var now = new Date();
                var dateStr = days[now.getDay()] + ', ngày ' + now.getDate() + ' tháng ' + (now.getMonth() + 1) + ' năm ' + now.getFullYear();
                var dateEl = document.getElementById('headerDate');
                if (dateEl) dateEl.textContent = dateStr;
            });
        </script>
    </header>
</body>
</html>
