<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title>Tổng quan - Bác sĩ</title>
</head>
<body>
    <div layout:fragment="content" class="doctor-dashboard">
        <link rel="stylesheet" th:href="@{/css/doctor.css}">

        <div class="doctor-stats">
            <div class="stat-card">
                <div class="stat-icon primary"><i class="bi bi-people"></i></div>
                <div class="stat-info">
                    <h3>Tổng khám hôm nay</h3>
                    <p th:text="${appointments.size()}">0</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon warning"><i class="bi bi-hourglass-split"></i></div>
                <div class="stat-info">
                    <h3>Đang chờ khám</h3>
                    <p th:text="${waitingCount}">0</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon success"><i class="bi bi-check-circle"></i></div>
                <div class="stat-info">
                    <h3>Đã hoàn tất</h3>
                    <p th:text="${completedCount}">0</p>
                </div>
            </div>
        </div>

        <div class="appointment-list-card">
            <div class="card-header">
                <h2>Lịch khám hôm nay</h2>
            </div>
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Thời gian</th>
                            <th>Bệnh nhân</th>
                            <th>Triệu chứng</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="appt : ${appointments}" th:if="${!appointments.isEmpty()}">
                            <td>
                                <strong th:text="${#temporals.format(appt.appointmentTime, 'HH:mm')}">08:00</strong>
                            </td>
                            <td>
                                <div th:text="${appt.patient.fullName}" style="font-weight: 500;">Nguyễn Văn A</div>
                                <small th:text="${appt.patient.gender.name() == 'MALE' ? 'Nam' : 'Nữ'} + ' - ' + ${#temporals.format(appt.patient.dateOfBirth, 'dd/MM/yyyy')}">Nam - 1990</small>
                            </td>
                            <td th:text="${appt.symptoms}">Đau đầu</td>
                            <td>
                                <span class="badge bg-warning text-dark" th:if="${appt.status.name() == 'CONFIRMED'}">Đang chờ khám</span>
                                <span class="badge bg-info" th:if="${appt.status.name() == 'EXAMINING'}">Đang khám</span>
                                <span class="badge bg-success" th:if="${appt.status.name() == 'COMPLETED'}">Hoàn tất</span>
                                <span class="badge bg-secondary" th:if="${appt.status.name() == 'WAITING_FOR_DRUG_PAYMENT'}">Chờ thanh toán thuốc</span>
                            </td>
                            <td>
                                <!-- Nút Khám (hiện khi đang chờ hoặc đang khám) -->
                                <a th:if="${appt.status.name() == 'CONFIRMED' || appt.status.name() == 'EXAMINING'}"
                                   th:href="@{/doctor/appointments/{id}/examine(id=${appt.id})}" 
                                   class="btn btn-sm btn-success fw-bold" style="border-radius: 20px; padding: 6px 16px;">
                                    <i class="bi bi-stethoscope me-1"></i> Khám bệnh
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${appointments.isEmpty()}">
                            <td colspan="5" class="text-center py-4 text-muted">
                                Không có lịch khám nào trong ngày hôm nay.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
