<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title>Quản trị - Tổng quan</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="welcome-section">
            <h2 class="welcome-title">Bảng điều khiển Quản trị viên</h2>
            <p class="welcome-subtitle">Quản lý tài khoản nhân sự, theo dõi doanh thu và giám sát hệ thống.</p>
        </div>

        <div class="row g-3">
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-card-header">
                        <div>
                            <div class="stat-card-value">0</div>
                            <div class="stat-card-label">Tổng tài khoản</div>
                        </div>
                        <div class="stat-card-icon primary">
                            <i class="bi bi-people"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-card-header">
                        <div>
                            <div class="stat-card-value">0</div>
                            <div class="stat-card-label">Bác sĩ</div>
                        </div>
                        <div class="stat-card-icon success">
                            <i class="bi bi-person-badge"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-card-header">
                        <div>
                            <div class="stat-card-value">0</div>
                            <div class="stat-card-label">Lịch khám hôm nay</div>
                        </div>
                        <div class="stat-card-icon warning">
                            <i class="bi bi-calendar-event"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-card-header">
                        <div>
                            <div class="stat-card-value">0 VND</div>
                            <div class="stat-card-label">Doanh thu tháng</div>
                        </div>
                        <div class="stat-card-icon danger">
                            <i class="bi bi-bar-chart-line"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
