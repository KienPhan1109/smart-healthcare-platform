<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title>Quản lý Nhân sự</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="container-fluid py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="mb-0 fw-bold" style="color: var(--hospital-primary-dark);"><i class="bi bi-person-badge text-primary me-2"></i> Danh Sách Nhân Sự</h2>
                <a th:href="@{/admin/staffs/create}" class="btn-premium px-4 shadow-sm">
                    <i class="bi bi-plus-circle me-2"></i> Thêm Nhân Viên Mới
                </a>
            </div>

            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Thanh tìm kiếm và lọc -->
            <div class="card shadow-sm border-0 rounded-3 mb-4">
                <div class="card-body">
                    <form th:action="@{/admin/staffs}" method="get" class="row g-3">
                        <div class="col-md-5">
                            <div class="input-group">
                                <span class="input-group-text bg-white text-muted"><i class="bi bi-search"></i></span>
                                <input type="text" class="form-control" name="keyword" th:value="${keyword}" placeholder="Tìm kiếm theo Tên hoặc Số điện thoại...">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <select name="specialtyId" class="form-select">
                                <option value="">-- Tất cả Chuyên khoa (dành cho Bác sĩ) --</option>
                                <option th:each="spec : ${specialties}" th:value="${spec.id}" th:text="${spec.name}" th:selected="${specialtyId == spec.id}"></option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <button type="submit" class="btn btn-primary w-100"><i class="bi bi-funnel me-1"></i> Lọc kết quả</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="bg-light">
                                <tr>
                                    <th class="px-4 py-3 text-uppercase text-secondary" style="font-size: 0.85rem;">Mã NV</th>
                                    <th class="px-4 py-3 text-uppercase text-secondary" style="font-size: 0.85rem;">Họ & Tên</th>
                                    <th class="px-4 py-3 text-uppercase text-secondary" style="font-size: 0.85rem;">Số Điện Thoại</th>
                                    <th class="px-4 py-3 text-uppercase text-secondary" style="font-size: 0.85rem;">Chức Vụ (Role)</th>
                                    <th class="px-4 py-3 text-uppercase text-secondary" style="font-size: 0.85rem;">Trạng Thái</th>
                                    <th class="px-4 py-3 text-uppercase text-secondary text-center" style="font-size: 0.85rem;">Hành Động</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${staffsPage.content.isEmpty()}">
                                    <td colspan="6" class="text-center py-4 text-muted">Không tìm thấy nhân sự nào phù hợp.</td>
                                </tr>
                                <tr th:each="staff : ${staffsPage.content}" class="border-bottom hover-elevate transition-all">
                                    <td class="px-4 fw-bold text-muted">#<span th:text="${staff.id}"></span></td>
                                    <td class="px-4">
                                        <div class="d-flex align-items-center">
                                            <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center me-3 fw-bold"
                                                 style="width: 40px; height: 40px;" th:text="${#strings.substring(staff.fullName, 0, 1)}">A</div>
                                            <div>
                                                <h6 class="mb-0 fw-bold text-dark" th:text="${staff.fullName}">Tên NV</h6>
                                                <small class="text-muted" th:text="${staff.email}">Email</small>
                                            </div>
                                        </div>
                                    </td>
                                    <td class="px-4" th:text="${staff.phoneNumber}">0987654321</td>
                                    <td class="px-4">
                                        <div th:each="ur : ${staff.userRoles}">
                                            <span class="badge bg-info bg-opacity-10 text-info border border-info rounded-pill px-3 py-2"
                                                  th:if="${ur.role.name.name() == 'ROLE_DOCTOR'}"><i class="bi bi-heart-pulse me-1"></i> Bác Sĩ</span>
                                            <span class="badge bg-warning bg-opacity-10 text-warning border border-warning rounded-pill px-3 py-2"
                                                  th:if="${ur.role.name.name() == 'ROLE_TECHNICIAN'}"><i class="bi bi-activity me-1"></i> Kỹ Thuật Viên</span>
                                            <span class="badge bg-secondary bg-opacity-10 text-secondary border border-secondary rounded-pill px-3 py-2"
                                                  th:if="${ur.role.name.name() == 'ROLE_COORDINATOR'}"><i class="bi bi-headset me-1"></i> Lễ Tân</span>
                                        </div>
                                    </td>
                                    <td class="px-4">
                                        <span class="badge bg-success" th:if="${staff.status.name() == 'ACTIVE'}">Hoạt động</span>
                                        <span class="badge bg-danger" th:if="${staff.status.name() == 'LOCKED'}">Đã khóa</span>
                                    </td>
                                    <td class="px-4 text-center">
                                        <a th:href="@{/admin/staffs/{id}/edit(id=${staff.id})}" class="btn btn-sm btn-outline-primary rounded-circle" title="Chỉnh sửa"><i class="bi bi-pencil"></i></a>
                                        <a th:href="@{/admin/staffs/{id}/confirm-lock(id=${staff.id})}" class="btn btn-sm btn-outline-danger rounded-circle ms-1" title="Khóa tài khoản" th:if="${staff.status.name() == 'ACTIVE'}">
                                            <i class="bi bi-lock"></i>
                                        </a>
                                        <a th:href="@{/admin/staffs/{id}/confirm-unlock(id=${staff.id})}" class="btn btn-sm btn-outline-success rounded-circle ms-1" title="Mở khóa" th:if="${staff.status.name() == 'LOCKED'}">
                                            <i class="bi bi-unlock"></i>
                                        </a>
                                    </td>
                                </tr>

                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Phân trang -->
            <div class="d-flex justify-content-center mt-4" th:if="${staffsPage.totalPages > 1}">
                <nav aria-label="Page navigation">
                    <ul class="pagination pagination-sm">
                        <li class="page-item" th:classappend="${staffsPage.first} ? 'disabled' : ''">
                            <a class="page-link" th:href="@{/admin/staffs(page=${staffsPage.number - 1}, keyword=${keyword}, specialtyId=${specialtyId})}" tabindex="-1">Trước</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, staffsPage.totalPages - 1)}"
                            th:classappend="${staffsPage.number == i} ? 'active' : ''">
                            <a class="page-link" th:href="@{/admin/staffs(page=${i}, keyword=${keyword}, specialtyId=${specialtyId})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${staffsPage.last} ? 'disabled' : ''">
                            <a class="page-link" th:href="@{/admin/staffs(page=${staffsPage.number + 1}, keyword=${keyword}, specialtyId=${specialtyId})}">Sau</a>
                        </li>
                    </ul>
                </nav>
            </div>

        </div>
    </div>
</body>
</html>
