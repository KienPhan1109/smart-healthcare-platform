<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title>Quản lý Nhân sự</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="container-fluid py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="mb-0 fw-bold" style="color: var(--hospital-primary-dark);"><i class="bi bi-person-badge text-primary me-2"></i> Danh Sách Nhân Sự</h2>
                <a th:href="@{/admin/staffs/create}" class="btn-premium px-4 shadow-sm">
                    <i class="bi bi-plus-circle me-2"></i> Thêm Nhân Viên Mới
                </a>
            </div>

            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="bg-light">
                                <tr>
                                    <th class="px-4 py-3 text-uppercase text-secondary" style="font-size: 0.85rem;">Mã NV</th>
                                    <th class="px-4 py-3 text-uppercase text-secondary" style="font-size: 0.85rem;">Họ & Tên</th>
                                    <th class="px-4 py-3 text-uppercase text-secondary" style="font-size: 0.85rem;">Số Điện Thoại</th>
                                    <th class="px-4 py-3 text-uppercase text-secondary" style="font-size: 0.85rem;">Chức Vụ (Role)</th>
                                    <th class="px-4 py-3 text-uppercase text-secondary" style="font-size: 0.85rem;">Trạng Thái</th>
                                    <th class="px-4 py-3 text-uppercase text-secondary text-center" style="font-size: 0.85rem;">Hành Động</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="staff : ${staffs}" class="border-bottom hover-elevate transition-all">
                                    <td class="px-4 fw-bold text-muted">#<span th:text="${staff.id}"></span></td>
                                    <td class="px-4">
                                        <div class="d-flex align-items-center">
                                            <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center me-3 fw-bold"
                                                 style="width: 40px; height: 40px;" th:text="${#strings.substring(staff.fullName, 0, 1)}">A</div>
                                            <div>
                                                <h6 class="mb-0 fw-bold text-dark" th:text="${staff.fullName}">Tên NV</h6>
                                                <small class="text-muted" th:text="${staff.email}">Email</small>
                                            </div>
                                        </div>
                                    </td>
                                    <td class="px-4" th:text="${staff.phoneNumber}">0987654321</td>
                                    <td class="px-4">
                                        <div th:each="ur : ${staff.userRoles}">
                                            <span class="badge bg-info bg-opacity-10 text-info border border-info rounded-pill px-3 py-2"
                                                  th:if="${ur.role.name.name() == 'ROLE_DOCTOR'}"><i class="bi bi-heart-pulse me-1"></i> Bác Sĩ</span>
                                            <span class="badge bg-warning bg-opacity-10 text-warning border border-warning rounded-pill px-3 py-2"
                                                  th:if="${ur.role.name.name() == 'ROLE_TECHNICIAN'}"><i class="bi bi-activity me-1"></i> Kỹ Thuật Viên</span>
                                            <span class="badge bg-secondary bg-opacity-10 text-secondary border border-secondary rounded-pill px-3 py-2"
                                                  th:if="${ur.role.name.name() == 'ROLE_COORDINATOR'}"><i class="bi bi-headset me-1"></i> Lễ Tân</span>
                                        </div>
                                    </td>
                                    <td class="px-4">
                                        <span class="badge bg-success" th:if="${staff.status.name() == 'ACTIVE'}">Hoạt động</span>
                                        <span class="badge bg-danger" th:if="${staff.status.name() == 'INACTIVE'}">Đã khóa</span>
                                    </td>
                                    <td class="px-4 text-center">
                                        <button class="btn btn-sm btn-outline-primary rounded-circle" title="Chỉnh sửa (Sắp ra mắt)"><i class="bi bi-pencil"></i></button>
                                        <button class="btn btn-sm btn-outline-danger rounded-circle ms-2" title="Khóa tài khoản (Sắp ra mắt)"><i class="bi bi-lock"></i></button>
                                    </td>
                                </tr>
                                <tr th:if="${staffs.isEmpty()}">
                                    <td colspan="6" class="text-center py-5 text-muted">Chưa có nhân viên nào trong hệ thống.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
