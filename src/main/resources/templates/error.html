<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lỗi Hệ Thống - Smart Healthcare Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #F4F7FC 0%, #E8EDF4 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }
        .error-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            padding: 48px 40px;
            text-align: center;
            max-width: 480px;
            width: 100%;
            animation: fadeInUp 0.5s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .error-icon-wrap {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FFEBEE, #FFCDD2);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }
        .error-icon-wrap i {
            font-size: 36px;
            color: #C62828;
        }
        .error-code {
            font-size: 56px;
            font-weight: 800;
            color: #1A2332;
            margin-bottom: 8px;
            line-height: 1;
        }
        .error-message {
            font-size: 15px;
            color: #5A6B7F;
            margin-bottom: 32px;
            line-height: 1.6;
        }
        .btn-home {
            background: linear-gradient(135deg, #1565C0, #42A5F5);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.25s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 3px 12px rgba(21, 101, 192, 0.25);
        }
        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 18px rgba(21, 101, 192, 0.35);
            color: white;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-icon-wrap">
            <i class="bi bi-exclamation-triangle-fill"></i>
        </div>
        <h1 class="error-code" th:text="${errorCode}">500</h1>
        <p class="error-message" th:text="${errorMessage}">Đã xảy ra lỗi hệ thống cục bộ. Đội ngũ kỹ thuật đã được thông báo.</p>
        <a href="/" class="btn-home">
            <i class="bi bi-house-door-fill"></i> Quay về trang chủ
        </a>
    </div>
</body>
</html>
