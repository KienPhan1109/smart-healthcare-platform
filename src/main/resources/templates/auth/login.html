<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Smart Healthcare</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-brand">
                <div class="auth-brand-icon"><i class="bi bi-hospital"></i></div>
                <h1 class="auth-brand-title">Smart Healthcare</h1>
                <p class="auth-brand-subtitle">Nền tảng Y tế Số Toàn diện</p>
            </div>

            <!-- Giao diện Alert nguyên bản -->
            <div th:if="${successMessage}" class="alert-hospital success">
                <i class="bi bi-check-circle"></i> <span th:text="${successMessage}"></span>
            </div>
            <div th:if="${param.logout}" class="alert-hospital success">
                <i class="bi bi-check-circle"></i> Bạn đã đăng xuất thành công
            </div>

            <form th:action="@{/login}" th:object="${loginRequest}" method="post" id="loginForm" novalidate>
                <div th:if="${#fields.hasErrors('global')}" class="alert-hospital danger">
                    <i class="bi bi-exclamation-triangle"></i> <span th:errors="*{global}"></span>
                </div>

                <div class="form-group">
                    <label for="phoneNumber">Số điện thoại</label>
                    <input type="text" class="form-control" id="phoneNumber" th:field="*{phoneNumber}"
                           th:classappend="${#fields.hasErrors('phoneNumber')} ? 'is-invalid-hospital'"
                           placeholder="Ví dụ: 0901234567" autofocus maxlength="10">
                    <div class="error-message show" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
                </div>
                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <div style="position: relative;">
                        <input type="password" class="form-control" id="password" name="password" th:value="*{password}"
                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid-hospital'"
                               placeholder="Nhập mật khẩu" style="padding-right: 40px;">
                        <span onclick="togglePasswordVisibility('password', this)" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #6c757d; z-index: 10;">
                            <i class="bi bi-eye"></i>
                        </span>
                    </div>
                    <div class="error-message show" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>
                <div class="remember-row">
                    <label><input type="checkbox" name="remember-me"> Lưu mật khẩu</label>
                    <a th:href="@{/forgot-password}" class="forgot-link">Quên mật khẩu?</a>
                </div>
                <button type="submit" class="btn-primary-hospital" id="btnLogin">
                    <i class="bi bi-box-arrow-in-right"></i> Đăng nhập
                </button>
            </form>

            <div class="auth-links">
                Chưa có tài khoản? <a th:href="@{/register}">Đăng ký ngay</a>
            </div>
        </div>
    </div>
    
    <script>
        function togglePasswordVisibility(fieldId, element) {
            const input = document.getElementById(fieldId);
            const icon = element.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        }
    </script>
</body>
</html>
