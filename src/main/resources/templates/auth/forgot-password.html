<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - Smart Healthcare</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-brand">
                <div class="auth-brand-icon"><i class="bi bi-shield-lock"></i></div>
                <h1 class="auth-brand-title">Khôi phục mật khẩu</h1>
                <p class="auth-brand-subtitle">Đặt lại mật khẩu tài khoản của bạn thông qua mã OTP</p>
            </div>

            <!-- Thanh tiến trình -->
            <div class="steps-indicator">
                <div class="step-dot" th:classappend="${step == 1 ? 'active' : (step > 1 ? 'done' : '')}" id="dot1"></div>
                <div class="step-dot" th:classappend="${step == 2 ? 'active' : (step > 2 ? 'done' : '')}" id="dot2"></div>
                <div class="step-dot" th:classappend="${step == 3 ? 'active' : (step > 3 ? 'done' : '')}" id="dot3"></div>
            </div>

            <!-- ============ BƯỚC 1: NHẬP SỐ ĐIỆN THOẠI ============ -->
            <div class="step-section" th:classappend="${step == 1 ? 'active' : ''}" th:if="${step == 1}">
                <form th:action="@{/forgot-password/step1}" th:object="${step1Dto}" method="post" novalidate>
                    <div class="form-group">
                        <label for="fPhone">Số điện thoại</label>
                        <input type="text" class="form-control" id="fPhone" th:field="*{phoneNumber}" 
                               th:classappend="${#fields.hasErrors('phoneNumber')} ? 'is-invalid-hospital'" 
                               placeholder="Nhập số điện thoại đã đăng ký" maxlength="10" autofocus>
                        <div class="error-message show" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
                    </div>
                    <button type="submit" class="btn-primary-hospital">
                        Tiếp tục <i class="bi bi-arrow-right"></i>
                    </button>
                </form>
            </div>

            <!-- ============ BƯỚC 2: NHẬP OTP ============ -->
            <div class="step-section" th:classappend="${step == 2 ? 'active' : ''}" th:if="${step == 2}">
                <form th:action="@{/forgot-password/step2}" method="post" novalidate>
                    <div style="text-align:center; margin-bottom:16px;">
                        <div style="font-size:13px; color:var(--hospital-text-secondary);">Mã OTP đã được gửi tới số điện thoại của bạn</div>
                    </div>
                    <div class="otp-display">Mã OTP của bạn: <strong th:text="${forgotOtpCode}">------</strong></div>
                    <div class="form-group">
                        <input type="text" class="form-control" name="otpInput" id="fOtpInput" 
                               th:classappend="${otpError != null} ? 'is-invalid-hospital'"
                               placeholder="Nhập 6 số OTP" maxlength="6" style="text-align:center; font-size:20px; letter-spacing:6px;">
                        <div class="error-message show" th:if="${otpError != null}" th:text="${otpError}"></div>
                    </div>
                    <button type="submit" class="btn-primary-hospital">
                        Xác nhận OTP <i class="bi bi-shield-check"></i>
                    </button>
                </form>
            </div>

            <!-- ============ BƯỚC 3: ĐẶT MẬT KHẨU MỚI ============ -->
            <div class="step-section" th:classappend="${step == 3 ? 'active' : ''}" th:if="${step == 3}">
                <form th:action="@{/forgot-password/step3}" th:object="${resetDto}" method="post" novalidate>
                    <div class="form-group">
                        <label for="fNewPass">Mật khẩu mới</label>
                        <input type="password" class="form-control" id="fNewPass" th:field="*{newPassword}" th:value="*{newPassword}"
                               th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid-hospital'" 
                               placeholder="Mật khẩu mới (Tối thiểu 6 ký tự)">
                        <div class="error-message show" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                    </div>
                    <div class="form-group">
                        <label for="fConfirmPass">Xác nhận mật khẩu mới</label>
                        <input type="password" class="form-control" id="fConfirmPass" th:field="*{confirmPassword}" th:value="*{confirmPassword}"
                               th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid-hospital'" 
                               placeholder="Nhập lại mật khẩu mới">
                        <div class="error-message show" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                    </div>
                    <button type="submit" class="btn-primary-hospital">
                        <i class="bi bi-check-circle"></i> Đổi mật khẩu
                    </button>
                </form>
            </div>

            <!-- ============ BƯỚC 4: THÀNH CÔNG ============ -->
            <div class="step-section" th:classappend="${step == 4 ? 'active' : ''}" th:if="${step == 4}">
                <div style="text-align:center; padding:10px 0;">
                    <div style="font-size:48px; color:var(--hospital-success); margin-bottom:12px;"><i class="bi bi-check-circle-fill"></i></div>
                    <h3 style="font-size:18px; font-weight:700; margin-bottom:8px;">Khôi phục thành công!</h3>
                    <p style="font-size:13px; color:var(--hospital-text-secondary); margin-bottom:24px;">Mật khẩu của bạn đã được thay đổi thành công. Hãy đăng nhập bằng mật khẩu mới.</p>
                    <a th:href="@{/login}" class="btn-primary-hospital" style="display:inline-block; text-decoration:none; line-height:38px;">
                        <i class="bi bi-box-arrow-in-right"></i> Đăng nhập ngay
                    </a>
                </div>
            </div>

            <div class="auth-links" th:if="${step != 4}">
                <a th:href="@{/login}"><i class="bi bi-arrow-left"></i> Quay lại Đăng nhập</a>
            </div>
        </div>
    </div>
</body>
</html>
