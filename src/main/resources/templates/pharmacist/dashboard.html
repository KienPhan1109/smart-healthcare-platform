<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title>Duoc si - Tong quan</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="welcome-section">
            <h2 class="welcome-title">Nha thuoc Benh vien</h2>
            <p class="welcome-subtitle">Tiep nhan don thuoc, soan thuoc va xac nhan cap phat.</p>
        </div>

        <div class="row g-3">
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="stat-card-header">
                        <div>
                            <div class="stat-card-value">0</div>
                            <div class="stat-card-label">Don cho phat</div>
                        </div>
                        <div class="stat-card-icon warning">
                            <i class="bi bi-clipboard2-pulse"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="stat-card-header">
                        <div>
                            <div class="stat-card-value">0</div>
                            <div class="stat-card-label">Da phat hom nay</div>
                        </div>
                        <div class="stat-card-icon success">
                            <i class="bi bi-bag-check"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="stat-card-header">
                        <div>
                            <div class="stat-card-value">0</div>
                            <div class="stat-card-label">Thuoc sap het</div>
                        </div>
                        <div class="stat-card-icon danger">
                            <i class="bi bi-exclamation-triangle"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
